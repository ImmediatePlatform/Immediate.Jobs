name: Build

on: 
  workflow_dispatch:
  push:
    branches: 
      - 'main'
    paths-ignore:
      - '**/readme.md'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: '0'

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          10.0.x
          11.0.x

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'

    - name: Resolve compatible dependency releases
      shell: python
      run: |
        import json,urllib.request
        result={}
        for p,prefix in [("Scalar.AspNetCore","2."),("dotnet-validate","0.0.1-"),("OpenTelemetry.Exporter.OpenTelemetryProtocol","1.20."),("OpenTelemetry.Extensions.Hosting","1.20."),("OpenTelemetry.Instrumentation.AspNetCore","1.20."),("OpenTelemetry.Instrumentation.Http","1.20."),("OpenTelemetry.Instrumentation.Runtime","1.20.")]:
            with urllib.request.urlopen("https://api.nuget.org/v3-flatcontainer/"+p.lower()+"/index.json") as r: vs=json.load(r)["versions"]
            result[p]=[v for v in vs if v.startswith(prefix) and ("-" not in v or p=="dotnet-validate")][-1]
        print("COMPATIBLE_DEPENDENCIES_JSON="+json.dumps(result,separators=(",",":")))

    - name: Restore tools
      run: dotnet tool restore

    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Test
      run: dotnet test -c Release --no-build -- --coverage --coverage-output-format cobertura --coverage-settings ./coverage-settings.xml

    - name: Check dashboard
      working-directory: src/Immediate.Jobs.Dashboard/DashboardClient
      run: npm run check

    - name: Package 
      run: dotnet pack -c Release --no-build --property:PackageOutputPath=../../nupkgs
    - name: Validate Package 
      run: |
        for package in ./nupkgs/*.nupkg; do
          dotnet tool run dotnet-validate -- package local "$package"
        done

    - name: Coveralls
      uses: coverallsapp/github-action@v2
      with:
        files: 'TestResults/*.cobertura.xml'
